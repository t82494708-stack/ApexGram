name: Build ApexGram
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    - name: Fix missing submodules
      run: |
        rm -rf TMessagesProj_Modules/media
        git clone --depth 1 https://github.com/DrKLO/Media.git TMessagesProj_Modules/media || true
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ApexGram-APK
        path: TMessagesProj/build/outputs/apk/debug/*.apk
