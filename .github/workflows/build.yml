name: Build ApexGram
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    - name: Patch media module and settings
      run: |
        # Создаем папку, если её нет
        mkdir -p TMessagesProj_Modules/media
        # Создаем пустой файл core_settings.gradle, чтобы Gradle не падал на чтении
        touch TMessagesProj_Modules/media/core_settings.gradle
        # Удаляем все упоминания media из settings.gradle, чтобы Gradle не искал его
        sed -i '/TMessagesProj_Modules:media/d' settings.gradle
        # Убираем зависимость от media в build.gradle
        sed -i "/project(':TMessagesProj_Modules:media3:media-lib-exoplayer')/d" TMessagesProj/build.gradle
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ApexGram-APK
        path: TMessagesProj/build/outputs/apk/debug/*.apk
