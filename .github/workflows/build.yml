name: Build ApexGram
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone full repository with submodules
      run: |
        git clone --recursive https://github.com/DrKLO/Telegram.git .
    - name: Rebrand to ApexGram
      run: |
        sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">ApexGram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ApexGram-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/*.apk
          **/*.apk
