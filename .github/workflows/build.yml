name: Build ApexGram
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    - name: Download media module manually
      run: |
        rm -rf TMessagesProj_Modules/media
        mkdir -p TMessagesProj_Modules
        wget https://github.com/TelegramMessenger/Telegram-Android-Media/archive/refs/heads/main.zip
        unzip main.zip
        mv Telegram-Android-Media-main TMessagesProj_Modules/media
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ApexGram-APK
        path: TMessagesProj/build/outputs/apk/debug/*.apk
